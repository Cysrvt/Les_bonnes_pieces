<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<title>Les Bonnes Pièces</title>
	<link rel="stylesheet" href="styles.css">
	<script type="module" src="pieces.js"></script>
</head>

<body>
	<header>
		<img src="images/logo-les-bonnes-pieces.png" alt="LOGO">
		<h1>Les Bonnes Pièces</h1>
	</header>
	<main>
		<!-- Menu de recherche -->
		<section class="filtres">
			<h3>Filtres</h3>
			<label for="inputRange">Prix max :</label>
			<input id="inputRange" name="inputRange" type="range" min="0" max="60" value="60" step="5">
			<br>
			<button class="btn-trier triCroissant">Trier par prix croissant</button>
			<br>
			<button class="btn-trier triDecroissant">Trier par prix décroissant</button>
			<br>
			<button class="btn-filtrer prixFilter">Filtrer les pièces non abordables</button>
			<br>
			<button class="btn-filtrer descriptionFilter">Filtrer les pièces non pas de description</button>
			<h3>Ajouter un avis</h3>
			<form class="formulaire-avis">
				Identifiant de la pièce :<br>
				<input type="number" name="piece-id" min="1"><br>
				Nom d'utilisateur :<br>
				<input type="text" name="utilisateur"><br>
				Avis :<br>
				<input type="text" name="commentaire"><br>
				Note :<br>
				<input type="number" name="nbEtoiles" min="0" max="5">
				<button>Envoyer</button>
			</form>
			<h3>Données</h3>
			<button class="btn-maj">Mettre à jour les pièces</button>
		</section>

		<!-- Fiches produits -->
		<section class="fiches">

			<div class="abordables">
				<p>Pièces abordables :</p>
			</div>
			<div class="disponibles">
				<p>Pièces disponibles :</p>
			</div>
		</section>
	</main>
</body>

</html>
